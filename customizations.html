This includes correct pricing:
•	Heart-shaped box: $10
•	Square box: $8
•	Circle box: $5
•	Medium size: +$3, Large: +$5, X-Large: +$7
•	$1 per color
<!-- ... same head/nav as other pages ... -->

<form id="customization-form">
  <label for="productType">Select Box Type</label>
  <select class="form-control" id="productType" onchange="updatePrice()">
    <option value="heart">Heart-shaped box</option>
    <option value="square">Square box</option>
    <option value="circle">Circle box</option>
  </select>

  <label for="size-options">Choose Size</label>
  <select class="form-select" id="size-options" onchange="updatePrice()">
    <option value="small">Small</option>
    <option value="medium">Medium</option>
    <option value="large">Large</option>
    <option value="x-large">X-Large</option>
  </select>

  <label for="color-options">Choose Color(s)</label>
  <input type="text" class="form-control" id="color-options" onchange="updatePrice()" placeholder="e.g. pink, purple">

  <h3 id="total-price">Total: $0.00</h3>
  <button type="submit" class="btn btn-custom">Add to Cart</button>
</form>

<script>
  function updatePrice() {
    let basePrice = 0;

    const box = document.getElementById("productType").value;
    const size = document.getElementById("size-options").value;
    const colorCount = document.getElementById("color-options").value.split(',').filter(c => c.trim()).length;

    if (box === "heart") basePrice += 10;
    if (box === "square") basePrice += 8;
    if (box === "circle") basePrice += 5;

    if (size === "medium") basePrice += 3;
    if (size === "large") basePrice += 5;
    if (size === "x-large") basePrice += 7;

    basePrice += colorCount * 1;

    document.getElementById("total-price").innerText = `Total: $${basePrice.toFixed(2)}`;
  }

  document.getElementById("customization-form").addEventListener("submit", function (e) {
    e.preventDefault();
    alert("Your customization has been added to the cart!");
  });
</script>
