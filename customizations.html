  <!-- Main Content -->
  <div class="container mt-4">
    <div class="row">
      <!-- Image Column -->
      <div class="col-md-6 text-center">
        <img src="custom.png" alt="Customize Product" class="img-fluid" style="border-radius: 10px;">
      </div>

      <!-- Form Column -->
      <div class="col-md-6">
        <h2>Customize Your Memory</h2>
        <form>
          <div class="form-group">
            <label for="productType">Select Product Type</label>
            <select class="form-control" id="productType">
              <option>Polaroid Frame</option>
              <option>Scrapbook Page</option>
              <option>Digital Collage</option>
            </select>
          </div>
          <div class="form-group">
            <label for="colors">Preferred Colors</label>
            <input type="text" class="form-control" id="colors" placeholder="e.g. pastel pink, mint green">
          </div>
          <div class="form-group">
            <label for="photoUpload">Upload Photo</label>
            <input type="file" class="form-control-file" id="photoUpload">
          </div>
          <div class="form-group">
            <label for="message">Personal Message</label>
            <textarea class="form-control" id="message" rows="3" placeholder="Type your message here..."></textarea>
          </div>
          <button type="submit" class="btn btn-outline-secondary">Submit Customization</button>
        </form>
      </div>
    </div>
  </div>
